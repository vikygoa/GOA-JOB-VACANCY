name: Goa Jobs

on:
  schedule:
    # Every 30 minutes
    - cron: "0,30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch new Instagram posts and all carousel slides
        run: python scraper/instagram_scraper.py

      - name: Extract jobs with Gemini - Free Tier Safe
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scraper/ai_parser.py

      - name: Publish maximum 3 jobs
        run: python scraper/publisher.py

      - name: Remove debug responses
        run: rm -rf debug

      - name: Commit updated data
        run: |
          git config user.name "goa-jobs-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data images
          git diff --cached --quiet || git commit -m "Update Goa jobs"
          git push
