<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Goa Jobs - Latest Job Vacancies in Goa</title>
<meta name="description" content="Latest job vacancies in Goa collected from public job-post sources.">
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f5f7fb;color:#18202a}
header{background:#0b6b4f;color:#fff;padding:22px 16px;text-align:center}
header h1{margin:0 0 6px;font-size:28px}header p{margin:0;opacity:.9}
main{max-width:1000px;margin:auto;padding:18px}
#status{margin:8px 0 18px;color:#566}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}
.card{background:#fff;border-radius:14px;padding:16px;box-shadow:0 2px 10px #0001}
.card h2{margin:0 0 8px;font-size:20px}.meta{margin:6px 0;color:#445}
.badge{display:inline-block;background:#e8f5ef;color:#086543;padding:5px 9px;border-radius:20px;font-size:12px}
.desc{line-height:1.5}.source{font-size:12px;color:#777;margin-top:12px}
a{color:#086543;text-decoration:none}.empty{padding:30px;text-align:center}
</style>
</head>
<body>
<header>
  <h1>Goa Jobs</h1>
  <p>Latest job vacancies in Goa</p>
</header>
<main>
  <div id="status">Loading jobs...</div>
  <section id="jobs" class="grid"></section>
</main>
<script>
function esc(v){
  return String(v ?? "Not specified").replace(/[&<>"']/g,m=>({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  }[m]));
}
async function load(){
  const status=document.getElementById("status"), box=document.getElementById("jobs");
  try{
    const r=await fetch("data/jobs.json?"+Date.now(),{cache:"no-store"});
    if(!r.ok) throw new Error("jobs.json unavailable");
    const d=await r.json(), jobs=d.jobs||[];
    status.textContent=jobs.length
      ? `${jobs.length} job listings`
      : "No jobs available yet.";
    box.innerHTML=jobs.map(j=>`
      <article class="card">
        <span class="badge">${esc(j.job_type)}</span>
        <h2>${esc(j.title)}</h2>
        <div class="meta"><b>Company:</b> ${esc(j.company)}</div>
        <div class="meta"><b>Location:</b> ${esc(j.location)}</div>
        <div class="meta"><b>Qualification:</b> ${esc(j.qualification)}</div>
        <div class="meta"><b>Experience:</b> ${esc(j.experience)}</div>
        <div class="meta"><b>Salary:</b> ${esc(j.salary)}</div>
        <div class="meta"><b>Last date:</b> ${esc(j.last_date)}</div>
        <p class="desc">${esc(j.description)}</p>
        <div class="meta"><b>Contact:</b> ${esc(j.contact)}</div>
        <div class="source">Source: @${esc(j.source_account)}</div>
      </article>`).join("");
  }catch(e){
    status.textContent="Could not load jobs.";
    box.innerHTML='<div class="empty">The jobs data has not been generated yet. Run the GitHub Action.</div>';
  }
}
load();
</script>
</body>
</html>
